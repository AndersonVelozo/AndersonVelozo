name: Generate Rocket Animation

on:
  # Executa automaticamente todos os dias à meia-noite (UTC)
  schedule:
    - cron: "0 0 * * *"

  # Permite execução manual via GitHub Actions
  workflow_dispatch:

jobs:
  generate:
    name: Fetch contributions and build rocket
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependência node-fetch
        run: npm install node-fetch

      - name: Executar script para obter contribuições do GitHub
        run: node scripts/fetch-contributions.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar arquivos para deploy
        run: |
          mkdir -p dist
          cp -r src/* dist/

      - name: Publicar na branch "output" via GitHub Pages
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
