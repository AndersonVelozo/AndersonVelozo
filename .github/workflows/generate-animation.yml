name: generate animation

on:
  # Executa automaticamente todos os dias à meia-noite (UTC)
  schedule:
    - cron: "0 0 * * *"

  # Permite executar manualmente via GitHub Actions
  workflow_dispatch:

  # Executa quando há push no branch master
  push:
    branches:
      - master

jobs:
  generate:
    name: Generate Snake Animation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Etapa de checkout é importante se você for precisar do conteúdo do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gera o SVG da grade de contribuições
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg

      # Publica os arquivos no branch "output"
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
